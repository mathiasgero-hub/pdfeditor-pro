# Réglages du lanceur PDFEdit Or (web). Les lignes qui commencent par # sont ignorées.

# Adresse de l'éditeur à ouvrir
url=https://pdfedit-or.ardoisia.com/

# Navigateur à utiliser (chemin complet de l'exécutable). Vide = navigateur par défaut de Windows.
# Exemple :  navigateur=C:\Program Files\Google\Chrome\Application\chrome.exe
navigateur=

# Port local utilisé par le lanceur (127.0.0.1 seulement). Si occupé, les 9 suivants sont essayés.
port=47650

# Secondes d'inactivité (page fermée) après lesquelles le lanceur en arrière-plan s'arrête tout seul
inactivite=300
