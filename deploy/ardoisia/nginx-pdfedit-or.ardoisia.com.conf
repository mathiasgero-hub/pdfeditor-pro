# PDFEdit Or — version Ardoisia : configuration nginx COMPLÈTE de pdfedit-or.ardoisia.com
# À installer sur le VPS : /etc/nginx/sites-available/pdfedit-ardoisia  (+ lien dans sites-enabled)
#
# Prérequis :
#   - certificat Let's Encrypt /etc/letsencrypt/live/pdfedit-or.ardoisia.com/ (obtenu avant, par la méthode webroot)
#   - snippets/ardoisia-gate-server.conf, ardoisia-gate-location.conf et ardoisia-gate-api.conf installés dans /etc/nginx/snippets/
#   - API de la plateforme démarrée sur 127.0.0.1:4300 (/auth/check)
#   - service pdfedit-ardoisia démarré sur 127.0.0.1:4960 ; site statique dans /var/www/pdfedit-ardoisia
#
# Fonctionnement : AVANT de servir une page ou de transmettre un appel d'API, nginx demande à la plateforme si la personne est
# connectée. Pas connecté : pages → redirection vers la connexion, API → JSON 401. Connecté sans accès complet : l'éditeur
# s'ouvre quand même (accès limité) mais les fonctions IA sont refusées par l'API.
# nginx transmet l'identité dans X-User-Id, X-Plan, X-User-Email, X-Institution-Id en REMPLAÇANT toute valeur envoyée par le navigateur.

upstream pdfedit_ardoisia {
    server 127.0.0.1:4960;
    keepalive 8;
}

# --- HTTP : défis Let's Encrypt puis redirection vers HTTPS -----------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name pdfedit-or.ardoisia.com;
    include snippets/deny-hidden.conf;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS ---------------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pdfedit-or.ardoisia.com;
    include snippets/deny-hidden.conf;

    ssl_certificate     /etc/letsencrypt/live/pdfedit-or.ardoisia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pdfedit-or.ardoisia.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=()" always;

    root /var/www/pdfedit-ardoisia;
    index index.html;

    # PDF et images envoyés à l'IA
    client_max_body_size 100m;

    include snippets/ardoisia-gate-server.conf;

    # --- Appels d'API (fonctions IA) : réponses JSON 401, jamais de redirection ---
    location ^~ /api/ {
        include snippets/ardoisia-gate-api.conf;
        proxy_pass http://pdfedit_ardoisia;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # génération d'image Gemini : jusqu'à ~4 min
        proxy_send_timeout 300s;
        proxy_request_buffering on;
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Le contrôle de santé de l'API n'est pas public
    location = /api/healthz {
        return 404;
    }

    # L'ancienne connexion Google n'existe pas ici
    location ^~ /auth/ {
        return 404;
    }

    # --- Page publique du lanceur Windows (explications + .zip) : OUVERTE À TOUS, sans passerelle de connexion ---
    location ^~ /lanceur/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # --- Éditeur (fichiers statiques) : accès contrôlé, revalidation à chaque chargement (noms de fichiers non versionnés) ---
    location / {
        include snippets/ardoisia-gate-location.conf;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    access_log /var/log/nginx/pdfedit-ardoisia.access.log;
    error_log  /var/log/nginx/pdfedit-ardoisia.error.log;
}
