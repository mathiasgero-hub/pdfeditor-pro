server {
    listen 80;
    server_name pdfedit-or.artmonie.com;

    # Redirection HTTPS (après certbot)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name pdfedit-or.artmonie.com;

    # Certificats Let's Encrypt (seront créés par certbot)
    ssl_certificate     /etc/letsencrypt/live/pdfedit-or.artmonie.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pdfedit-or.artmonie.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/pdfedit-or;
    index index.html;

    # Taille maximale (upload PDF, pages envoyées à l'IA)
    client_max_body_size 100M;

    # Compte Google et relais Gemini / Google Vision : serveur Node (web-server/, service pdfedit-api)
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:4950;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # génération d'image Gemini : jusqu'à ~4 min
        proxy_send_timeout 300s;
        proxy_request_buffering on;
        add_header Cache-Control "no-store";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
    }

    location ^~ /auth/ {
        proxy_pass http://127.0.0.1:4950;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
    }

    # Code et HTML : noms de fichiers non versionnés -> revalidation à chaque
    # chargement (ETag / 304), sinon les utilisateurs gardent l'ancienne version.
    # (add_header dans une location annule ceux du server : on les répète.)
    location ~* \.(js|css|json|html)$ {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        add_header Permissions-Policy "camera=(), microphone=()";
    }

    # Images et polices : cache 7 jours
    location ~* \.(woff2?|ttf|png|ico|svg)$ {
        expires 7d;
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        add_header Permissions-Policy "camera=(), microphone=()";
    }

    # SPA : tout renvoie vers index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Sécurité
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Permissions-Policy "camera=(), microphone=()";
}
