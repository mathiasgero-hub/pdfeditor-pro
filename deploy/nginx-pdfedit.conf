server {
    listen 80;
    server_name pdfedit-or.artmonie.com;

    # Redirection HTTPS (après certbot)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name pdfedit-or.artmonie.com;

    # Certificats Let's Encrypt (seront créés par certbot)
    ssl_certificate     /etc/letsencrypt/live/pdfedit-or.artmonie.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pdfedit-or.artmonie.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/pdfedit-or;
    index index.html;

    # Code et HTML : noms de fichiers non versionnés -> revalidation à chaque
    # chargement (ETag / 304), sinon les utilisateurs gardent l'ancienne version.
    # (add_header dans une location annule ceux du server : on les répète.)
    location ~* \.(js|css|json|html)$ {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        add_header Permissions-Policy "camera=(), microphone=()";
    }

    # Images et polices : cache 7 jours
    location ~* \.(woff2?|ttf|png|ico|svg)$ {
        expires 7d;
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        add_header Permissions-Policy "camera=(), microphone=()";
    }

    # SPA : tout renvoie vers index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Sécurité
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Permissions-Policy "camera=(), microphone=()";

    # Taille maximale (upload PDF)
    client_max_body_size 100M;
}
